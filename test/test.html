<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat testen</title>
  <style>
    :root {
      color: #202923;
      font: 16px/1.45 system-ui, sans-serif;
      background: #dfe5e1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .chat { width: min(100%, 640px); height: 100dvh; min-height: 420px; margin: 0 auto; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; background: #efeae2; box-shadow: 0 0 24px #14282022; }
    header { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1rem; color: #fff; background: #075e54; }
    .call-controls { display: flex; align-items: center; gap: 0.4rem; }
    #incoming-call-actions[hidden] { display: none; }
    .call-media { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
    #call-media[hidden] { display: none; }
    .call-media video { width: 100%; max-height: 220px; aspect-ratio: 16 / 9; border-radius: 5px; background: #16221f; object-fit: cover; }
    .call-media audio { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .avatar { display: grid; width: 3rem; aspect-ratio: 1; place-items: center; flex: 0 0 auto; border-radius: 50%; background: #d7e8d9; color: #075e54; font-size: 1.2rem; font-weight: 700; }
    .heading { min-width: 0; }
    h1 { overflow: hidden; margin: 0; font-size: 1.1rem; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    #status { margin: 0.1rem 0 0; color: #d4e8e1; font-size: 0.82rem; }
    #status.connected { color: #d4e8e1; }
    #status.error { color: #ffd1c7; }
    #room-form { display: grid; gap: 0.55rem; padding: 0.65rem; background: #f7f8f5; border-bottom: 1px solid #d9ded9; }
    .profile-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; }
    .room-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 0.45rem; }
    .field { display: grid; min-width: 0; gap: 0.2rem; color: #526158; font-size: 0.75rem; font-weight: 650; }
    input, button { min-width: 0; min-height: 2.7rem; padding: 0.55rem 0.7rem; border: 1px solid #cbd4ce; border-radius: 5px; font: inherit; }
    input { background: #fff; }
    input:focus { outline: 2px solid #48a184; outline-offset: 1px; }
    button { border-color: #087b67; color: #fff; background: #087b67; cursor: pointer; }
    button:disabled { border-color: #b8c2bc; background: #b8c2bc; cursor: not-allowed; }
    .conversation { min-height: 0; overflow-y: auto; padding: 1rem 0.75rem; background-color: #efeae2; background-image: radial-gradient(circle at 15px 18px, #d8d2c866 1px, transparent 1.8px), radial-gradient(circle at 38px 42px, #d8d2c855 1px, transparent 1.8px); background-size: 52px 52px; }
    .today { width: fit-content; margin: 0 auto 1rem; padding: 0.35rem 0.8rem; border-radius: 7px; color: #59635e; background: #d8eaf0; font-size: 0.82rem; text-transform: uppercase; }
    .room-note { margin: 0 0 1rem; padding: 0.7rem 0.8rem; border: 1px solid #e5d99c; border-radius: 7px; color: #625b3d; background: #fff4c6; text-align: center; font-size: 0.88rem; }
    #messages { display: flex; flex-direction: column; gap: 0.45rem; margin: 0; padding: 0; list-style: none; }
    #messages li { max-width: 84%; overflow-wrap: anywhere; padding: 0.55rem 0.7rem 0.35rem; border-radius: 8px; box-shadow: 0 1px 1px #14282018; }
    #messages li.own { align-self: flex-end; background: #d9fdd3; }
    #messages li.other { align-self: flex-start; background: #fff; }
    #messages .sender { display: block; margin-bottom: 0.15rem; color: #167b68; font-size: 0.78rem; font-weight: 700; }
    #messages li.own .sender { display: none; }
    #messages .message-meta { display: flex; justify-content: flex-end; align-items: center; gap: 0.3rem; margin-top: 0.1rem; color: #76817a; font-size: 0.7rem; }
    #messages .receipt { color: #168c52; font-size: 0.9rem; font-weight: 700; }
    #messages .receipt.seen { color: #168c52; }
    #chat-form { display: flex; gap: 0.55rem; padding: 0.65rem; background: #f5f6f3; }
    #msg { flex: 1; border-radius: 20px; padding-inline: 1rem; }
    #chat-form button { min-width: 5.2rem; border-radius: 20px; }
    @media (max-width: 520px) {
      .chat { min-height: 100dvh; }
      .profile-fields { grid-template-columns: 1fr 1fr; }
      .field.email { grid-column: 1 / -1; }
      .room-controls { grid-template-columns: 1fr; }
      .conversation { padding-inline: 0.55rem; }
    }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <div class="avatar" id="avatar" aria-hidden="true">C</div>
      <div class="heading">
        <h1 id="chat-title">Dein Chat</h1>
        <p id="status" role="status">Verbinde mit dem Chat-Server ...</p>
      </div>
      <div class="call-controls">
        <button id="audio-call" type="button" disabled> Audioanruf</button>
        <button id="video-call" type="button" disabled> Videoanruf</button>
      </div>
      <div id="incoming-call-actions" class="call-controls" hidden>
        <span id="incoming-call-label"></span>
        <button id="accept-call" type="button">Annehmen</button>
        <button id="reject-call" type="button">Ablehnen</button>
      </div>
    </header>
    <form id="room-form">
      <div class="profile-fields">
        <label class="field">Vorname
          <input id="first-name" maxlength="40" autocomplete="given-name" required>
        </label>
        <label class="field">Nachname
          <input id="last-name" maxlength="60" autocomplete="family-name" required>
        </label>
        <label class="field email">E-Mail
          <input id="email" type="email" maxlength="254" autocomplete="email" required>
        </label>
      </div>
      <div class="room-controls">
        <label class="field">Raum
          <input id="room" maxlength="40" value="raum-1" required>
        </label>
        <button type="submit">Raum betreten</button>
      </div>
    </form>
    <section class="conversation" aria-label="Nachrichten">
      <div class="today">Heute</div>
      <p class="room-note">Teile den Raumnamen nur mit der Person, die du einladen möchtest.</p>
      <div id="call-media" class="call-media" hidden>
        <video id="remote-video" autoplay playsinline hidden></video>
        <video id="local-video" autoplay muted playsinline hidden></video>
        <audio id="remote-audio" autoplay></audio>
        <button id="end-call" type="button">Auflegen</button>
      </div>
      <ul id="messages" aria-live="polite"></ul>
    </section>
    <form id="chat-form">
      <input id="msg" autocomplete="off" placeholder="Nachricht schreiben" aria-label="Nachricht" disabled>
      <button type="submit" disabled>Senden</button>
    </form>
  </main>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    const socket = io('http://localhost:3000');
    const status = document.getElementById('status');
    const chatTitle = document.getElementById('chat-title');
    const avatar = document.getElementById('avatar');
    const messageInput = document.getElementById('msg');
    const sendButton = document.querySelector('#chat-form button');
    let activeRoom = '';
    let activeUser = '';
    let activeUserId = null;
    let activePeer = '';
    let historyLoaded = false;
    let pendingMessages = [];
    let pendingMessageText = '';
    let incomingCallKind = null;
    let currentCallId = null;
    let currentCallKind = null;
    let peerConnection = null;
    let localMediaStream = null;
    const pendingIceCandidates = [];

    function markIncomingMessagesAsRead() {
      if (document.visibilityState !== 'visible') return;

      const unreadMessages = document.querySelectorAll(
        '#messages li.other[data-message-id]:not([data-read-receipt-sent])',
      );
      unreadMessages.forEach((item) => {
        item.dataset.readReceiptSent = 'true';
        socket.emit('messageRead', { messageId: item.dataset.messageId });
      });
    }

    document.addEventListener('visibilitychange', markIncomingMessagesAsRead);

    socket.on('connect', () => {
      status.classList.add('connected');
      if (activeRoom) socket.emit('joinRoom', { room: activeRoom, user: activeUser });
      else status.textContent = 'Verbunden. Bitte einen Raum betreten.';
    });

    socket.on('disconnect', () => {
      status.textContent = 'Verbindung getrennt';
      status.classList.remove('connected');
      status.classList.add('error');
      messageInput.disabled = true;
      sendButton.disabled = true;
      audioCallButton.disabled = true;
      videoCallButton.disabled = true;
      finishCall('Verbindung getrennt');
    });

    socket.on('roomJoined', ({ room, userId }) => {
      activeRoom = room;
      activeUserId = userId;
      audioCallButton.disabled = false;
      videoCallButton.disabled = false;
      activePeer = '';
      historyLoaded = false;
      pendingMessages = [];
      chatTitle.textContent = room;
      avatar.textContent = room.charAt(0).toUpperCase();
      status.textContent = 'Lade gespeicherte Nachrichten ...';
      status.classList.remove('error');
      messageInput.disabled = true;
      sendButton.disabled = true;
      document.getElementById('messages').replaceChildren();
    });

    function renderMessage(data) {
      const messages = document.getElementById('messages');
      const messageId = String(data.messageId);
      if ([...messages.children].some((item) => item.dataset.messageId === messageId)) return;

      const own = String(data.userId) === String(activeUserId)
        || (!data.userId && data.senderId === socket.id);
      if (!own) {
        activePeer = data.user;
        chatTitle.textContent = activePeer;
        avatar.textContent = activePeer.charAt(0).toUpperCase();
      }
      const li = document.createElement('li');
      li.className = own ? 'own' : 'other';
      li.dataset.messageId = messageId;
      const sender = document.createElement('span');
      sender.className = 'sender';
      sender.textContent = data.user;
      const message = document.createElement('span');
      message.textContent = data.message;
      const time = document.createElement('span');
      time.className = 'message-time';
      time.textContent = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' })
        .format(new Date(data.createdAt || Date.now()));
      const meta = document.createElement('span');
      meta.className = 'message-meta';




      meta.appendChild(time);
      if (own) {
        const receipt = document.createElement('span');
        receipt.className = 'receipt';
        receipt.dataset.messageId = messageId;
        receipt.textContent = '✓';
        receipt.title = 'In der Datenbank gespeichert';
        receipt.setAttribute('aria-label', 'In der Datenbank gespeichert');
        meta.appendChild(receipt);
      }
      li.append(sender, message, meta);
      messages.appendChild(li);
      messages.parentElement.scrollTop = messages.parentElement.scrollHeight;
      if (!own) markIncomingMessagesAsRead();
    }


    const audioCallButton = document.getElementById('audio-call');
    const videoCallButton = document.getElementById('video-call');
    const incomingCallActions = document.getElementById('incoming-call-actions');
    const incomingCallLabel = document.getElementById('incoming-call-label');
    const acceptCallButton = document.getElementById('accept-call');
    const rejectCallButton = document.getElementById('reject-call');
    const callMedia = document.getElementById('call-media');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const remoteAudio = document.getElementById('remote-audio');
    const endCallButton = document.getElementById('end-call');

    function finishCall(message) {
      if (peerConnection) {
        peerConnection.onicecandidate = null;
        peerConnection.ontrack = null;
        peerConnection.close();
      }
      peerConnection = null;
      localMediaStream?.getTracks().forEach((track) => track.stop());
      localMediaStream = null;
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      remoteAudio.srcObject = null;
      localVideo.hidden = true;
      remoteVideo.hidden = true;
      callMedia.hidden = true;
      incomingCallActions.hidden = true;
      incomingCallKind = null;
      currentCallId = null;
      currentCallKind = null;
      pendingIceCandidates.length = 0;
      if (message) status.textContent = message;
    }

    async function prepareCallMedia(kind) {
      localMediaStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: kind === 'video',
      });
      callMedia.hidden = false;
      localVideo.hidden = kind !== 'video';
      remoteVideo.hidden = kind !== 'video';
      if (kind === 'video') localVideo.srcObject = localMediaStream;

      peerConnection = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
      });
      localMediaStream.getTracks().forEach((track) => {
        peerConnection.addTrack(track, localMediaStream);
      });
      peerConnection.onicecandidate = ({ candidate }) => {
        if (candidate && currentCallId) {
          socket.emit('call:signal', {
            callId: currentCallId,
            signal: { type: 'ice-candidate', candidate },
          });
        }
      };
      peerConnection.ontrack = ({ streams }) => {
        const [remoteStream] = streams;
        remoteVideo.srcObject = remoteStream;
        remoteAudio.srcObject = remoteStream;
        remoteAudio.play().catch(() => {});
      };
      peerConnection.onconnectionstatechange = () => {
        if (peerConnection?.connectionState === 'connected') {
          status.textContent = currentCallKind === 'video' ? 'Videoanruf aktiv' : 'Audioanruf aktiv';
        } else if (peerConnection?.connectionState === 'failed') {
          status.textContent = 'Verbindung fehlgeschlagen. Ein TURN-Server kann erforderlich sein.';
        }
      };
    }

    async function flushPendingIceCandidates() {
      while (pendingIceCandidates.length && peerConnection?.remoteDescription) {
        await peerConnection.addIceCandidate(pendingIceCandidates.shift());
      }
    }

    async function inviteCall(kind) {
      if (!socket.connected || !activeRoom) return;
      currentCallId = socket.id;
      currentCallKind = kind;
      status.textContent = `${kind === 'video' ? 'Video' : 'Audio'}anruf wird gestartet ...`;
      socket.emit('call:invite', { kind });
    }

    audioCallButton.addEventListener('click', () => {
      inviteCall('audio');
    });

    videoCallButton.addEventListener('click', () => {
      inviteCall('video');
    });

    socket.on('call:incoming', ({ callId, fromName, kind }) => {
      currentCallId = callId;
      currentCallKind = kind;
      incomingCallKind = kind;
      const callType = kind === 'video' ? 'Videoanruf' : 'Audioanruf';
      incomingCallLabel.textContent = `${fromName} ruft an (${callType})`;
      incomingCallActions.hidden = false;
      status.textContent = 'Eingehender Anruf';
    });

    acceptCallButton.addEventListener('click', async () => {
      if (!incomingCallKind) return;
      try {
        await prepareCallMedia(incomingCallKind);
        socket.emit('call:respond', { accepted: true });
        status.textContent = 'Anruf angenommen. Verbinde ...';
        incomingCallActions.hidden = true;
        incomingCallKind = null;
      } catch {
        socket.emit('call:respond', { accepted: false });
        finishCall('Mikrofon oder Kamera konnte nicht gestartet werden. Bitte Berechtigung prüfen.');
      }
    });

    rejectCallButton.addEventListener('click', () => {
      if (!incomingCallKind) return;
      socket.emit('call:respond', { accepted: false });
      finishCall('Anruf abgelehnt.');
    });

    socket.on('call:response', async ({ accepted, callId, kind }) => {
      const callType = kind === 'video' ? 'Videoanruf' : 'Audioanruf';
      if (!accepted) {
        finishCall(`${callType} abgelehnt.`);
        return;
      }

      currentCallId = callId;
      currentCallKind = kind;
      try {
        await prepareCallMedia(kind);
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('call:signal', {
          callId,
          signal: { type: 'offer', description: peerConnection.localDescription },
        });
        status.textContent = 'Anruf angenommen. Verbinde ...';
      } catch {
        socket.emit('call:end', { callId });
        finishCall('Mikrofon oder Kamera konnte nicht gestartet werden. Bitte Berechtigung prüfen.');
      }
    });

    socket.on('call:signal', async ({ callId, signal }) => {
      if (callId !== currentCallId || !peerConnection || !signal) return;
      try {
        if (signal.type === 'offer') {
          await peerConnection.setRemoteDescription(signal.description);
          await flushPendingIceCandidates();
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit('call:signal', {
            callId,
            signal: { type: 'answer', description: peerConnection.localDescription },
          });
        } else if (signal.type === 'answer') {
          await peerConnection.setRemoteDescription(signal.description);
          await flushPendingIceCandidates();
        } else if (signal.type === 'ice-candidate') {
          if (peerConnection.remoteDescription) {
            await peerConnection.addIceCandidate(signal.candidate);
          } else {
            pendingIceCandidates.push(signal.candidate);
          }
        }
      } catch {
        socket.emit('call:end', { callId });
        finishCall('Die Medienverbindung konnte nicht aufgebaut werden.');
      }
    });

    endCallButton.addEventListener('click', () => {
      if (currentCallId) socket.emit('call:end', { callId: currentCallId });
      finishCall('Anruf beendet.');
    });

    socket.on('call:ended', ({ reason }) => {
      finishCall(reason === 'peer-disconnected'
        ? 'Die andere Person hat die Verbindung getrennt.'
        : 'Anruf beendet.');
    });

    socket.on('call:error', (message) => {
      status.textContent = message;
      status.classList.add('error');
      if (currentCallId && !peerConnection) finishCall(message);
    });

    socket.on('messageHistory', (history) => {
      history.forEach(renderMessage);
      pendingMessages.forEach(renderMessage);
      pendingMessages = [];
      historyLoaded = true;
      messageInput.disabled = false;
      sendButton.disabled = false;
      status.textContent = `Verbunden mit Raum: ${activeRoom}`;
      status.classList.remove('error');
      markIncomingMessagesAsRead();
    });

    socket.on('messageHistoryError', (message) => {
      historyLoaded = true;
      pendingMessages.forEach(renderMessage);
      pendingMessages = [];
      messageInput.disabled = false;
      sendButton.disabled = false;
      status.textContent = `${message} Neue Nachrichten können weiterhin gesendet werden.`;
      status.classList.add('error');
    });

    socket.on('roomError', (message) => {
      status.textContent = message;
      status.classList.add('error');
    });

    socket.on('receivedMessage', (data) => {
      if (!historyLoaded) {
        pendingMessages.push(data);
        return;
      }
      renderMessage(data);
      if (String(data.userId) === String(activeUserId)) {
        pendingMessageText = '';
        messageInput.value = '';
        messageInput.disabled = false;
        sendButton.disabled = false;
        status.textContent = `In der Datenbank gespeichert · ${activeRoom}`;
      }
    });

    socket.on('messageError', (message) => {
      status.textContent = message;
      status.classList.add('error');
      messageInput.value = pendingMessageText;
      pendingMessageText = '';
      messageInput.disabled = false;
      sendButton.disabled = false;
      messageInput.focus();
    });

    socket.on('messageRead', ({ messageId, readerId }) => {
      if (readerId === socket.id) return;
      const receipt = [...document.querySelectorAll('.receipt')]
        .find((item) => item.dataset.messageId === messageId);
      if (!receipt) return;
      receipt.textContent = '✓✓';
      receipt.classList.add('seen');
      receipt.title = 'Gelesen';
      receipt.setAttribute('aria-label', 'Gelesen');
    });

    document.getElementById('room-form').addEventListener('submit', (event) => {
      event.preventDefault();
      if (!socket.connected) return;
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      activeUser = `${firstName} ${lastName}`;
      socket.emit('joinRoom', {
        room: document.getElementById('room').value,
        user: activeUser,
        email: document.getElementById('email').value.trim(),
      });
    });

    document.getElementById('chat-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message || !socket.connected || !activeRoom) return;

      pendingMessageText = message;
      messageInput.disabled = true;
      sendButton.disabled = true;
      status.textContent = 'Speichere Nachricht ...';
      status.classList.remove('error');
      socket.emit('sendMessage', { user: activeUser, message });
    });
  </script>
</body>
</html>
