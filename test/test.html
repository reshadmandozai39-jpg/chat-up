<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat testen</title>
  <style>
    :root {
      color: #202b3a;
      font: 15px/1.5 "Avenir Next", Avenir, "Segoe UI", sans-serif;
      background: #eceeef;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #292d32;
      --muted: #626a73;
      --line: #d1d5d9;
      --accent: #454b52;
      --accent-hover: #30353b;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      padding: 20px;
      background: radial-gradient(ellipse at 12% 10%, #ffffff 0, transparent 38%), linear-gradient(145deg, #f4f5f6, #e5e7e9);
    }
    .chat {
      width: min(100%, 880px);
      height: min(920px, calc(100dvh - 40px));
      min-height: 460px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      background: #fafbfc;
      border: 1px solid #d1d5d9;
      border-radius: 8px;
      box-shadow: 0 24px 70px #263b501c, 0 3px 10px #263b500d;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
      padding: 0.9rem 1.1rem;
      color: #f7f9fc;
      background: var(--ink);
    }
    .call-controls { display: flex; align-items: center; gap: 0.45rem; }
    header > .call-controls:not(#incoming-call-actions) { margin-left: auto; }
    #incoming-call-actions[hidden] { display: none; }
    .call-media { display: grid; width: 100%; min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
    #call-media[hidden] { display: none; }
    .call-media video { display: block; width: 100%; min-width: 0; max-width: 100%; max-height: 220px; aspect-ratio: 16 / 9; border-radius: 6px; background: #101a25; object-fit: contain; }
    .call-media audio { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .avatar {
      display: grid;
      width: 2.85rem;
      aspect-ratio: 1;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #ffffff30;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, #71777e, #454b52);
      font-size: 1.05rem;
      font-weight: 700;
    }
    .heading { min-width: 0; }
    h1 { overflow: hidden; margin: 0; font-size: 1.05rem; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    #status { margin: 0.12rem 0 0; color: #d1d5d9; font-size: 0.8rem; }
    #status.connected { color: #e0e3e6; }
    #status.error { color: #f1f2f3; }
    #room-form {
      display: grid;
      min-width: 0;
      gap: 0.65rem;
      padding: 0.85rem 1rem;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .profile-fields { display: grid; min-width: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.65rem; }
    .room-controls { display: grid; min-width: 0; grid-template-columns: minmax(0, 1fr) auto auto; align-items: end; gap: 0.65rem; }
    .field { display: grid; min-width: 0; gap: 0.3rem; color: #454b52; font-size: 0.74rem; font-weight: 650; }
    input, button { min-width: 0; min-height: 2.55rem; padding: 0.55rem 0.75rem; border: 1px solid #c4c9ce; border-radius: 5px; font: inherit; }
    input { color: #292d32; background: #fff; transition: border-color 140ms ease, box-shadow 140ms ease; }
    input:focus { border-color: #555c63; outline: 3px solid #555c6335; outline-offset: 1px; }
    button { border-color: var(--accent); color: #fff; background: var(--accent); font-size: 0.86rem; font-weight: 650; cursor: pointer; transition: background 140ms ease, border-color 140ms ease, transform 140ms ease; }
    button:hover:not(:disabled) { border-color: var(--accent-hover); background: var(--accent-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #737a8155; outline-offset: 2px; }
    button:disabled { border-color: #626a73; color: #fff; background: #626a73; cursor: not-allowed; }
    #open-second-user { border-color: #c4c9ce; color: #373d43; background: #f0f2f3; }
    #open-second-user:hover { border-color: #aeb4ba; background: #e5e7e9; }
    header button { border-color: #ffffff35; color: #f7f9fc; background: #ffffff12; }
    header button:hover:not(:disabled) { border-color: #ffffff65; background: #ffffff24; }
    header button:disabled { border-color: #ffffff20; color: #a9b5c1; background: #ffffff0c; }
    .conversation {
      min-height: 0;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      background-color: #eceeef;
      background-image: radial-gradient(circle, #c2c7cc80 0.8px, transparent 1px);
      background-size: 28px 28px;
      scrollbar-color: #b8c5d0 transparent;
    }
    .today { width: fit-content; margin: 0 auto 1rem; padding: 0.28rem 0.75rem; border: 1px solid #c4c9ce; border-radius: 20px; color: #454b52; background: #fafbfc; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .room-note { max-width: 520px; margin: 0 auto 1rem; padding: 0.65rem 0.8rem; border: 1px solid #c4c9ce; border-radius: 6px; color: #454b52; background: #fafbfc; text-align: center; font-size: 0.82rem; }
    #messages { display: flex; flex-direction: column; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
    #messages li { max-width: min(78%, 560px); overflow-wrap: anywhere; padding: 0.6rem 0.8rem 0.4rem; border: 1px solid #d1d5d9; border-radius: 8px; box-shadow: 0 2px 5px #25292e12; }
    #messages li.own { align-self: flex-end; border-color: #c0c5ca; background: #e5e7e9; }
    #messages li.other { align-self: flex-start; background: #fff; }
    #messages .sender { display: block; margin-bottom: 0.15rem; color: #454b52; font-size: 0.76rem; font-weight: 700; }
    #messages li.own .sender { display: none; }
    #messages .message-meta { display: flex; justify-content: flex-end; align-items: center; gap: 0.3rem; margin-top: 0.12rem; color: #626a73; font-size: 0.68rem; }
    #messages .receipt { color: #555c63; font-size: 0.88rem; font-weight: 700; }
    #messages .receipt.seen { color: #373d43; }
    #messages audio { display: block; width: min(100%, 300px); height: 2.7rem; }
    #chat-form { display: flex; gap: 0.55rem; padding: 0.75rem 0.85rem; background: #fff; border-top: 1px solid var(--line); }
    #msg { flex: 1; border-radius: 6px; padding-inline: 0.9rem; }
    #chat-form button { min-width: 5rem; border-radius: 5px; }
    #voice-message { min-width: 2.8rem; padding-inline: 0.65rem; }
    #voice-message.recording { border-color: #292d32; background: #292d32; }
    @media (max-width: 600px) {
      body { padding: 0; background: #fafbfc; }
      .chat { width: 100%; height: 100dvh; min-height: 420px; border: 0; border-radius: 0; box-shadow: none; }
      header { flex-wrap: wrap; padding: 0.75rem; }
      header > .call-controls:not(#incoming-call-actions) { margin-left: auto; }
      .call-controls { gap: 0.35rem; }
      header button { min-height: 2.35rem; padding: 0.4rem 0.55rem; font-size: 0.76rem; }
      #room-form { padding: 0.7rem; }
      .profile-fields { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .field.email { grid-column: 1 / -1; }
      .room-controls { grid-template-columns: minmax(0, 1fr) auto auto; gap: 0.5rem; }
      .call-media { grid-template-columns: minmax(0, 1fr); }
      .conversation { padding: 1rem 0.65rem; }
      #messages li { max-width: 88%; }
    }
    @media (max-width: 390px) {
      header { gap: 0.6rem; }
      .avatar { width: 2.5rem; }
      header > .call-controls:not(#incoming-call-actions) { width: calc(100% - 3.1rem); margin-left: 3.1rem; }
      header > .call-controls:not(#incoming-call-actions) button { flex: 1; }
      .room-controls { grid-template-columns: 1fr; }
      .room-controls button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <div class="avatar" id="avatar" aria-hidden="true">C</div>
      <div class="heading">
        <h1 id="chat-title">Dein Chat</h1>
        <p id="status" role="status">Verbinde mit dem Chat-Server ...</p>
      </div>
      <div class="call-controls">
        <button id="audio-call" type="button" disabled> Audioanruf</button>
        <button id="video-call" type="button" disabled> Videoanruf</button>
      </div>
      <div id="incoming-call-actions" class="call-controls" hidden>
        <span id="incoming-call-label"></span>
        <button id="accept-call" type="button">Annehmen</button>
        <button id="reject-call" type="button">Ablehnen</button>
      </div>
    </header>
    <form id="room-form">
      <div class="profile-fields">
        <label class="field">Vorname
          <input id="first-name" maxlength="40" autocomplete="given-name" required>
        </label>
        <label class="field">Nachname
          <input id="last-name" maxlength="60" autocomplete="family-name" required>
        </label>
        <label class="field email">E-Mail
          <input id="email" type="email" maxlength="254" autocomplete="email" required>
        </label>
      </div>
      <div class="room-controls">
        <label class="field">Raum
          <input id="room" maxlength="40" value="raum-1" required>
        </label>
        <button type="submit">Raum betreten</button>
        <button id="open-second-user" type="button">Zweiten Nutzer öffnen</button>
      </div>
    </form>
    <section class="conversation" aria-label="Nachrichten">
      <div class="today">Heute</div>
      <p class="room-note">Teile den Raumnamen nur mit der Person, die du einladen möchtest.</p>
      <div id="call-media" class="call-media" hidden>
        <video id="remote-video" autoplay playsinline hidden></video>
        <video id="local-video" autoplay muted playsinline hidden></video>
        <audio id="remote-audio" autoplay></audio>
        <button id="end-call" type="button">Auflegen</button>
      </div>
      <ul id="messages" aria-live="polite"></ul>
    </section>
    <form id="chat-form">
      <button id="voice-message" type="button" disabled aria-label="Sprachnachricht aufnehmen" aria-pressed="false" title="Sprachnachricht aufnehmen">🎙</button>
      <input id="msg" autocomplete="off" placeholder="Nachricht schreiben" aria-label="Nachricht" disabled>
      <button type="submit" disabled>Senden</button>
    </form>
  </main>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    const pageUrl = new URL(window.location.href);
    const pageParameters = new URLSearchParams(pageUrl.search);
    const serverOverride = pageParameters.get('server');
    const isSecondTestUser = pageParameters.get('testUser') === '2';
    if (isSecondTestUser) {
      const roomInput = document.getElementById('room');
      roomInput.value = pageParameters.get('room') || roomInput.value;
      document.getElementById('first-name').value = 'Test';
      document.getElementById('last-name').value = 'User Two';
      const roomSlug = roomInput.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'raum-1';
      document.getElementById('email').value = `test-user-two-${roomSlug}@example.test`;
    }
    const defaultServerUrl = pageUrl.protocol === 'file:'
      ? 'http://localhost:3000'
      : pageUrl.port === '5501'
        ? `${pageUrl.protocol}//${pageUrl.hostname}:3000`
        : pageUrl.origin;
    const socket = io(serverOverride || defaultServerUrl);
    let iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
    const status = document.getElementById('status');
    const chatTitle = document.getElementById('chat-title');
    const avatar = document.getElementById('avatar');
    const messageInput = document.getElementById('msg');
    const sendButton = document.querySelector('#chat-form button[type="submit"]');
    const voiceMessageButton = document.getElementById('voice-message');
    const maxVoiceMessageDuration = 60_000;
    let activeRoom = '';
    let activeUser = '';
    let activeUserId = null;
    let activePeer = '';
    let historyLoaded = false;
    let pendingMessages = [];
    let pendingMessageText = '';
    let incomingCallKind = null;
    let currentCallId = null;
    let currentCallKind = null;
    let peerConnection = null;
    let localMediaStream = null;
    let voiceAudioContext = null;
    let voiceAudioSource = null;
    let voiceAudioProcessor = null;
    let voiceSilenceGain = null;
    let voiceRecorderStream = null;
    let voiceRecorderOwnsStream = false;
    let voiceRecordingTimeout = null;
    let voiceRecordingSamples = [];
    const pendingIceCandidates = [];

    function markIncomingMessagesAsRead() {
      if (document.visibilityState !== 'visible') return;

      const unreadMessages = document.querySelectorAll(
        '#messages li.other[data-message-id]:not([data-read-receipt-sent])',
      );
      unreadMessages.forEach((item) => {
        item.dataset.readReceiptSent = 'true';
        socket.emit('messageRead', { messageId: item.dataset.messageId });
      });
    }

    document.addEventListener('visibilitychange', markIncomingMessagesAsRead);

    socket.on('call:config', (config) => {
      if (Array.isArray(config?.iceServers) && config.iceServers.length) {
        iceServers = config.iceServers;
      }
    });

    socket.on('connect', () => {
      status.classList.add('connected');
      if (activeRoom) socket.emit('joinRoom', { room: activeRoom, user: activeUser });
      else if (isSecondTestUser) document.getElementById('room-form').requestSubmit();
      else status.textContent = 'Verbunden. Bitte einen Raum betreten.';
    });

    socket.on('disconnect', () => {
      status.textContent = 'Verbindung getrennt';
      status.classList.remove('connected');
      status.classList.add('error');
      messageInput.disabled = true;
      sendButton.disabled = true;
      voiceMessageButton.disabled = true;
      audioCallButton.disabled = true;
      videoCallButton.disabled = true;
      if (voiceAudioProcessor) stopVoiceRecording(false);
      finishCall('Verbindung getrennt');
    });

    socket.on('roomJoined', ({ room, userId }) => {
      activeRoom = room;
      activeUserId = userId;
      audioCallButton.disabled = false;
      videoCallButton.disabled = false;
      voiceMessageButton.disabled = false;
      activePeer = '';
      historyLoaded = false;
      pendingMessages = [];
      chatTitle.textContent = room;
      avatar.textContent = room.charAt(0).toUpperCase();
      status.textContent = 'Lade gespeicherte Nachrichten ...';
      status.classList.remove('error');
      messageInput.disabled = true;
      sendButton.disabled = true;
      document.getElementById('messages').replaceChildren();
    });

    function renderMessage(data) {
      const messages = document.getElementById('messages');
      const messageId = String(data.messageId);
      if ([...messages.children].some((item) => item.dataset.messageId === messageId)) return;

      const own = String(data.userId) === String(activeUserId)
        || (!data.userId && data.senderId === socket.id);
      if (!own) {
        activePeer = data.user;
        chatTitle.textContent = activePeer;
        avatar.textContent = activePeer.charAt(0).toUpperCase();
      }
      const li = document.createElement('li');
      li.className = own ? 'own' : 'other';
      li.dataset.messageId = messageId;
      const sender = document.createElement('span');
      sender.className = 'sender';
      sender.textContent = data.user;
      let message;
      if (data.type === 'AUDIO') {
        message = document.createElement('audio');
        message.controls = true;
        message.preload = 'metadata';
        message.src = data.message;
        message.setAttribute('aria-label', `Sprachnachricht von ${data.user}`);
      } else {
        message = document.createElement('span');
        message.textContent = data.message;
      }
      const time = document.createElement('span');
      time.className = 'message-time';
      time.textContent = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' })
        .format(new Date(data.createdAt || Date.now()));
      const meta = document.createElement('span');
      meta.className = 'message-meta';




      meta.appendChild(time);
      if (own) {
        const receipt = document.createElement('span');
        receipt.className = 'receipt';
        receipt.dataset.messageId = messageId;
        receipt.textContent = '✓';
        receipt.title = 'In der Datenbank gespeichert';
        receipt.setAttribute('aria-label', 'In der Datenbank gespeichert');
        meta.appendChild(receipt);
      }
      li.append(sender, message, meta);
      messages.appendChild(li);
      messages.parentElement.scrollTop = messages.parentElement.scrollHeight;
      if (!own) markIncomingMessagesAsRead();
    }

    function createWavRecording(chunks, sampleRate) {
      const sampleCount = chunks.reduce((count, chunk) => count + chunk.length, 0);
      if (!sampleCount) return { blob: new Blob([], { type: 'audio/wav' }), hasSignal: false };
      const dataSize = sampleCount * 2;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);
      let peak = 0;
      const writeText = (offset, text) => {
        for (let index = 0; index < text.length; index += 1) {
          view.setUint8(offset + index, text.charCodeAt(index));
        }
      };

      writeText(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeText(8, 'WAVE');
      writeText(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeText(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (const chunk of chunks) {
        for (const sample of chunk) {
          const clipped = Math.max(-1, Math.min(1, sample));
          peak = Math.max(peak, Math.abs(clipped));
          view.setInt16(offset, clipped < 0 ? clipped * 0x8000 : clipped * 0x7fff, true);
          offset += 2;
        }
      }

      return { blob: new Blob([buffer], { type: 'audio/wav' }), hasSignal: peak > 0.001 };
    }

    async function stopVoiceRecording(shouldSend = true) {
      if (!voiceAudioProcessor) return;
      clearTimeout(voiceRecordingTimeout);
      voiceAudioProcessor.onaudioprocess = null;
      voiceAudioProcessor.disconnect();
      voiceAudioSource?.disconnect();
      voiceSilenceGain?.disconnect();
      const sampleRate = voiceAudioContext.sampleRate;
      await voiceAudioContext.close().catch(() => {});
      voiceAudioContext = null;
      voiceAudioSource = null;
      voiceAudioProcessor = null;
      voiceSilenceGain = null;
      voiceMessageButton.classList.remove('recording');
      voiceMessageButton.setAttribute('aria-pressed', 'false');
      voiceMessageButton.title = 'Sprachnachricht aufnehmen';

      if (voiceRecorderOwnsStream) {
        voiceRecorderStream?.getTracks().forEach((track) => track.stop());
      }
      voiceRecorderStream = null;
      voiceRecorderOwnsStream = false;

      const { blob: recording, hasSignal } = createWavRecording(voiceRecordingSamples, sampleRate);
      voiceRecordingSamples = [];
      if (!recording.size || !hasSignal) {
        status.textContent = 'Kein Ton erkannt. Bitte Mikrofon prüfen und erneut aufnehmen.';
        return;
      }
      if (!shouldSend || !socket.connected || !activeRoom) return;

      status.textContent = 'Sende Sprachnachricht ...';
      socket.emit('sendAudioMessage', {
        mimeType: recording.type,
        data: await recording.arrayBuffer(),
      });
    }

    async function startVoiceRecording() {
      if (!activeRoom || !socket.connected) return;

      try {
        voiceRecorderOwnsStream = !localMediaStream;
        voiceRecorderStream = localMediaStream
          ? new MediaStream(localMediaStream.getAudioTracks())
          : await navigator.mediaDevices.getUserMedia({ audio: true });
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error('Web Audio is not supported');
        voiceAudioContext = new AudioContextClass({ sampleRate: 48_000 });
        await voiceAudioContext.resume();
        voiceAudioSource = voiceAudioContext.createMediaStreamSource(voiceRecorderStream);
        voiceAudioProcessor = voiceAudioContext.createScriptProcessor(4096, 1, 1);
        voiceSilenceGain = voiceAudioContext.createGain();
        voiceSilenceGain.gain.value = 0;
        voiceRecordingSamples = [];
        voiceAudioProcessor.onaudioprocess = (event) => {
          voiceRecordingSamples.push(new Float32Array(event.inputBuffer.getChannelData(0)));
        };
        voiceAudioSource.connect(voiceAudioProcessor);
        voiceAudioProcessor.connect(voiceSilenceGain);
        voiceSilenceGain.connect(voiceAudioContext.destination);
        voiceMessageButton.classList.add('recording');
        voiceMessageButton.setAttribute('aria-pressed', 'true');
        voiceMessageButton.title = 'Aufnahme stoppen';
        status.textContent = 'Aufnahme läuft. Zum Stoppen erneut auf das Mikrofon klicken.';
        voiceRecordingTimeout = setTimeout(() => {
          stopVoiceRecording();
        }, maxVoiceMessageDuration);
      } catch (error) {
        voiceAudioProcessor?.disconnect();
        voiceAudioSource?.disconnect();
        voiceSilenceGain?.disconnect();
        await voiceAudioContext?.close().catch(() => {});
        voiceAudioContext = null;
        voiceAudioSource = null;
        voiceAudioProcessor = null;
        voiceSilenceGain = null;
        voiceRecorderStream?.getTracks().forEach((track) => track.stop());
        voiceRecorderStream = null;
        voiceRecorderOwnsStream = false;
        status.textContent = error?.name === 'NotAllowedError'
          ? 'Mikrofonzugriff blockiert. Bitte die Browser-Berechtigung prüfen.'
          : 'Die Sprachnachricht konnte nicht aufgenommen werden.';
      }
    }

    voiceMessageButton.addEventListener('click', () => {
      if (voiceAudioProcessor) stopVoiceRecording();
      else startVoiceRecording();
    });


    const audioCallButton = document.getElementById('audio-call');
    const videoCallButton = document.getElementById('video-call');
    const incomingCallActions = document.getElementById('incoming-call-actions');
    const incomingCallLabel = document.getElementById('incoming-call-label');
    const acceptCallButton = document.getElementById('accept-call');
    const rejectCallButton = document.getElementById('reject-call');
    const callMedia = document.getElementById('call-media');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const remoteAudio = document.getElementById('remote-audio');
    const endCallButton = document.getElementById('end-call');

    function finishCall(message) {
      if (peerConnection) {
        peerConnection.onicecandidate = null;
        peerConnection.ontrack = null;
        peerConnection.close();
      }
      peerConnection = null;
      localMediaStream?.getTracks().forEach((track) => track.stop());
      localMediaStream = null;
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      remoteAudio.srcObject = null;
      localVideo.hidden = true;
      remoteVideo.hidden = true;
      callMedia.hidden = true;
      incomingCallActions.hidden = true;
      incomingCallKind = null;
      currentCallId = null;
      currentCallKind = null;
      pendingIceCandidates.length = 0;
      if (message) status.textContent = message;
    }

    function mediaErrorMessage(error) {
      if (error?.name === 'NotAllowedError' || error?.name === 'SecurityError') {
        return 'Mikrofonzugriff blockiert. Bitte Browser-Berechtigung und HTTPS prüfen.';
      }
      if (error?.name === 'NotFoundError') {
        return 'Kein Mikrofon oder keine Kamera gefunden.';
      }
      if (error?.name === 'NotReadableError') {
        return 'Mikrofon oder Kamera wird gerade von einer anderen Anwendung verwendet.';
      }
      return 'Mikrofon oder Kamera konnte nicht gestartet werden. Bitte Gerät und Berechtigung prüfen.';
    }

    async function prepareCallMedia(kind) {
      localMediaStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: kind === 'video',
      });
      callMedia.hidden = false;
      localVideo.hidden = kind !== 'video';
      remoteVideo.hidden = kind !== 'video';
      if (kind === 'video') localVideo.srcObject = localMediaStream;

      peerConnection = new RTCPeerConnection({
        iceServers,
      });
      localMediaStream.getTracks().forEach((track) => {
        peerConnection.addTrack(track, localMediaStream);
      });
      peerConnection.onicecandidate = ({ candidate }) => {
        if (candidate && currentCallId) {
          socket.emit('call:signal', {
            callId: currentCallId,
            signal: { type: 'ice-candidate', candidate },
          });
        }
      };
      peerConnection.ontrack = ({ streams }) => {
        const [remoteStream] = streams;
        remoteVideo.srcObject = remoteStream;
        remoteAudio.srcObject = remoteStream;
        remoteAudio.play().catch(() => {});
      };
      peerConnection.onconnectionstatechange = () => {
        if (peerConnection?.connectionState === 'connected') {
          status.textContent = currentCallKind === 'video' ? 'Videoanruf aktiv' : 'Audioanruf aktiv';
        } else if (peerConnection?.connectionState === 'failed') {
          status.textContent = 'Verbindung fehlgeschlagen. Ein TURN-Server kann erforderlich sein.';
        }
      };
    }

    async function flushPendingIceCandidates() {
      while (pendingIceCandidates.length && peerConnection?.remoteDescription) {
        await peerConnection.addIceCandidate(pendingIceCandidates.shift());
      }
    }

    async function inviteCall(kind) {
      if (!socket.connected || !activeRoom) return;
      currentCallId = socket.id;
      currentCallKind = kind;
      status.textContent = `${kind === 'video' ? 'Video' : 'Audio'}anruf wird gestartet ...`;
      socket.emit('call:invite', { kind });
    }

    audioCallButton.addEventListener('click', () => {
      inviteCall('audio');
    });

    videoCallButton.addEventListener('click', () => {
      inviteCall('video');
    });

    socket.on('call:incoming', ({ callId, fromName, kind }) => {
      currentCallId = callId;
      currentCallKind = kind;
      incomingCallKind = kind;
      const callType = kind === 'video' ? 'Videoanruf' : 'Audioanruf';
      incomingCallLabel.textContent = `${fromName} ruft an (${callType})`;
      incomingCallActions.hidden = false;
      status.textContent = 'Eingehender Anruf';
    });

    acceptCallButton.addEventListener('click', async () => {
      if (!incomingCallKind) return;
      try {
        await prepareCallMedia(incomingCallKind);
        socket.emit('call:respond', { accepted: true });
        status.textContent = 'Anruf angenommen. Verbinde ...';
        incomingCallActions.hidden = true;
        incomingCallKind = null;
      } catch (error) {
        socket.emit('call:respond', { accepted: false });
        finishCall(mediaErrorMessage(error));
      }
    });

    rejectCallButton.addEventListener('click', () => {
      if (!incomingCallKind) return;
      socket.emit('call:respond', { accepted: false });
      finishCall('Anruf abgelehnt.');
    });

    socket.on('call:response', async ({ accepted, callId, kind }) => {
      const callType = kind === 'video' ? 'Videoanruf' : 'Audioanruf';
      if (!accepted) {
        finishCall(`${callType} abgelehnt.`);
        return;
      }

      currentCallId = callId;
      currentCallKind = kind;
      try {
        await prepareCallMedia(kind);
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('call:signal', {
          callId,
          signal: { type: 'offer', description: peerConnection.localDescription },
        });
        status.textContent = 'Anruf angenommen. Verbinde ...';
      } catch (error) {
        socket.emit('call:end', { callId });
        finishCall(mediaErrorMessage(error));
      }
    });

    socket.on('call:signal', async ({ callId, signal }) => {
      if (callId !== currentCallId || !peerConnection || !signal) return;
      try {
        if (signal.type === 'offer') {
          await peerConnection.setRemoteDescription(signal.description);
          await flushPendingIceCandidates();
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit('call:signal', {
            callId,
            signal: { type: 'answer', description: peerConnection.localDescription },
          });
        } else if (signal.type === 'answer') {
          await peerConnection.setRemoteDescription(signal.description);
          await flushPendingIceCandidates();
        } else if (signal.type === 'ice-candidate') {
          if (peerConnection.remoteDescription) {
            await peerConnection.addIceCandidate(signal.candidate);
          } else {
            pendingIceCandidates.push(signal.candidate);
          }
        }
      } catch {
        socket.emit('call:end', { callId });
        finishCall('Die Medienverbindung konnte nicht aufgebaut werden.');
      }
    });

    endCallButton.addEventListener('click', () => {
      if (currentCallId) socket.emit('call:end', { callId: currentCallId });
      finishCall('Anruf beendet.');
    });

    socket.on('call:ended', ({ reason }) => {
      finishCall(reason === 'peer-disconnected'
        ? 'Die andere Person hat die Verbindung getrennt.'
        : 'Anruf beendet.');
    });

    socket.on('call:error', (message) => {
      status.textContent = message;
      status.classList.add('error');
      if (currentCallId && !peerConnection) finishCall(message);
    });

    socket.on('messageHistory', (history) => {
      history.forEach(renderMessage);
      pendingMessages.forEach(renderMessage);
      pendingMessages = [];
      historyLoaded = true;
      messageInput.disabled = false;
      sendButton.disabled = false;
      voiceMessageButton.disabled = false;
      status.textContent = `Verbunden mit Raum: ${activeRoom}`;
      status.classList.remove('error');
      markIncomingMessagesAsRead();
    });

    socket.on('messageHistoryError', (message) => {
      historyLoaded = true;
      pendingMessages.forEach(renderMessage);
      pendingMessages = [];
      messageInput.disabled = false;
      sendButton.disabled = false;
      voiceMessageButton.disabled = false;
      status.textContent = `${message} Neue Nachrichten können weiterhin gesendet werden.`;
      status.classList.add('error');
    });

    socket.on('roomError', (message) => {
      status.textContent = message;
      status.classList.add('error');
    });

    socket.on('receivedMessage', (data) => {
      if (!historyLoaded) {
        pendingMessages.push(data);
        return;
      }
      renderMessage(data);
      if (String(data.userId) === String(activeUserId)) {
        pendingMessageText = '';
        messageInput.value = '';
        messageInput.disabled = false;
        sendButton.disabled = false;
        status.textContent = `In der Datenbank gespeichert · ${activeRoom}`;
      }
    });

    socket.on('messageError', (message) => {
      status.textContent = message;
      status.classList.add('error');
      messageInput.value = pendingMessageText;
      pendingMessageText = '';
      messageInput.disabled = false;
      sendButton.disabled = false;
      voiceMessageButton.disabled = false;
      messageInput.focus();
    });

    socket.on('messageRead', ({ messageId, readerId }) => {
      if (readerId === socket.id) return;
      const receipt = [...document.querySelectorAll('.receipt')]
        .find((item) => item.dataset.messageId === messageId);
      if (!receipt) return;
      receipt.textContent = '✓✓';
      receipt.classList.add('seen');
      receipt.title = 'Gelesen';
      receipt.setAttribute('aria-label', 'Gelesen');
    });

    document.getElementById('room-form').addEventListener('submit', (event) => {
      event.preventDefault();
      if (!socket.connected) return;
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      activeUser = `${firstName} ${lastName}`;
      socket.emit('joinRoom', {
        room: document.getElementById('room').value,
        user: activeUser,
        email: document.getElementById('email').value.trim(),
      });
    });

    document.getElementById('open-second-user').addEventListener('click', () => {
      const secondUserUrl = new URL(window.location.href);
      secondUserUrl.searchParams.set('testUser', '2');
      secondUserUrl.searchParams.set('room', document.getElementById('room').value.trim());
      window.open(secondUserUrl, '_blank', 'noopener');
    });

    document.getElementById('chat-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message || !socket.connected || !activeRoom) return;

      pendingMessageText = message;
      messageInput.disabled = true;
      sendButton.disabled = true;
      status.textContent = 'Speichere Nachricht ...';
      status.classList.remove('error');
      socket.emit('sendMessage', { user: activeUser, message });
    });
  </script>
</body>
</html>
